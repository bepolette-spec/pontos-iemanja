<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0d2354">
<title>Pontos e Cantigas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2354;--navy2:#173a7d;--sea:#2a6fb5;--gold:#c49a48;--gold-d:#9a742c;--gold-l:#efe2c3;--cream:#f7f3ea;--card:#fff;--ink:#1d2232;--muted:#697083;--line:#e6dcc6;--ok:#2f855a;--bad:#c0392b;--fs:18px;--r:14px}
*{box-sizing:border-box}
html{scroll-padding-top:150px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* topo */
.hero{position:relative;color:#fff;background:radial-gradient(120% 140% at 85% -10%,#2f6fb8 0,transparent 55%),linear-gradient(160deg,var(--navy) 0%,var(--navy2) 70%,#1f4f97 100%);overflow:hidden}
.hero-in{position:relative;z-index:2;max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:18px 16px 38px}
.logo{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.25);flex:none}
.ht{flex:1;min-width:0}
.ht h1{margin:0;font:700 23px/1.1 "Cinzel",Georgia,serif;letter-spacing:.04em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25);overflow-wrap:anywhere}
.ht p{margin:4px 0 0;color:var(--gold-l);font:italic 15px "Lora",Georgia,serif;letter-spacing:.03em}
.adm-btn{flex:none;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 12px;font-size:14px}
.adm-btn:hover{background:rgba(255,255,255,.16)}
.adm-btn .lbl{display:none}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;z-index:1}
/* barra de filtros */
.bar{position:sticky;top:0;z-index:30;background:rgba(247,243,234,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding:10px 16px 8px;display:grid;grid-template-columns:1fr auto;gap:8px}
.search{position:relative}
.search input,.in{width:100%;border:1px solid #d9ccad;background:#fff;border-radius:12px;padding:11px 12px 11px 38px;font-size:16px;outline:none}
.in{padding-left:12px}
.search input:focus,.in:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(42,111,181,.15)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.fsz{display:flex;gap:6px}
.fsz button{width:44px;border:1px solid #d9ccad;background:#fff;border-radius:12px;font-weight:700;color:var(--navy)}
.filters{grid-column:1/-1;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.chip.pick{border-style:dashed;color:var(--gold-d)}
.sep{flex:none;width:1px;height:22px;background:var(--line)}
/* layout */
.layout{max-width:1280px;margin:0 auto;padding:14px 16px 60px;display:grid;grid-template-columns:1fr;gap:22px}
.side{display:none}
.res-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px;color:var(--muted);font-size:14px}
.res-head b{color:var(--ink)}
.link-btn{border:0;background:none;color:var(--sea);font-size:14px;padding:4px 6px;text-decoration:underline}
.grp{margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.grp h2{margin:0;font:700 20px "Cinzel",Georgia,serif;color:var(--navy);letter-spacing:.05em}
.grp .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.grp .ct{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:0 1px 2px rgba(30,30,60,.04),0 6px 18px rgba(30,30,60,.04);border-top:3px solid var(--gold)}
.card h3{margin:0;font:600 18px "Lora",Georgia,serif;color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tag{font-size:12px;border-radius:999px;padding:3px 9px;background:#eef3fb;color:var(--navy2);border:1px solid #d7e3f5}
.tag.ox{background:#fbf3e1;color:var(--gold-d);border-color:var(--gold-l);font-weight:600}
.letra{font:var(--fs)/1.55 "Lora",Georgia,serif;color:#262a36}
.est{margin:0 0 .85em;position:relative}
.est:last-child{margin-bottom:.2em}
.est.rep{padding-right:48px;border-right:2px solid var(--gold);border-radius:0 8px 8px 0}
.est.rep:after{content:"2X";position:absolute;right:8px;top:50%;transform:translateY(-50%);font:700 13px/1 Inter,Arial,sans-serif;color:var(--gold-d)}
.est.trad{background:#f6f0e1;border-radius:10px;padding:10px 12px;font-size:.88em;color:#4c4637}
.est.trad b{display:block;font:700 13px Inter,Arial,sans-serif;color:var(--navy);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.l{display:block}
.x{font:700 .7em Inter,Arial,sans-serif;color:var(--gold-d);white-space:nowrap}
.refrao{font-style:italic;color:var(--gold-d)}
mark{background:#ffe7a0;color:inherit;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.red{background:#c4302b}
.btn.dark{background:#4a4f5c}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0c7c1}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.yt{font-size:14px;color:var(--muted)}
.novid{font-size:13px;color:var(--muted);font-style:italic}
.video{margin-top:12px;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty b{display:block;font:600 18px "Lora",Georgia,serif;color:var(--navy);margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
.credito{font-size:11px;margin-top:6px;opacity:.8;letter-spacing:.02em}
.top{position:fixed;right:16px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* sidebar (desktop) */
.side-box{position:sticky;top:132px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:calc(100vh - 150px);overflow:auto}
.side-box h4{margin:0 0 10px;font:700 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}
.side-box .in{padding:9px 10px;font-size:14px;margin-bottom:8px}
.sopt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:15px;color:var(--ink)}
.sopt:hover{background:#f4efe3}
.sopt.on{background:var(--navy);color:#fff}
.sopt .n{color:var(--muted);font-size:13px}
.sopt.on .n{color:#c9d4ec}
/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,18,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.dlg{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .2s}
.dlg h3{margin:0 0 12px;font:700 19px "Lora",Georgia,serif;color:var(--navy)}
.dlg p{margin:0 0 12px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.ov,.dlg{animation:none}}
.plist{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:52vh;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:#faf8f3;border-radius:10px;padding:11px 12px;font-size:15px}
.opt:hover{border-color:var(--line)}
.opt.on{background:#e9f0fb;border-color:#c9d9f2;color:var(--navy);font-weight:600}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid #b9c3d6;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.opt.on .ck{background:var(--sea);border-color:var(--sea)}
.opt.on .ck:after{content:"✓"}
.muted{color:var(--muted);font-size:14px}
/* formulários */
.fld{margin-bottom:14px}
.fld>label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--navy)}
.fld .hint{font-size:13px;color:var(--muted);margin-top:5px}
.fld textarea.in{min-height:220px;font:16px/1.5 "Lora",Georgia,serif;resize:vertical}
.selbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #d9ccad;background:#fff;border-radius:12px;padding:11px 12px;text-align:left;font-size:16px}
.selbtn .ph{color:var(--muted)}
.selchips{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--bad);font-size:13px;margin-top:5px}
.okmsg{color:var(--ok);font-size:13px;margin-top:5px}
.row2{display:grid;grid-template-columns:1fr;gap:0 14px}
.prev{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:8px;background:#fdfbf6}
/* admin */
.admin{position:fixed;inset:0;z-index:60;background:var(--cream);overflow:auto}
.a-top{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff}
.a-top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.a-top h2{margin:0;flex:1;font:700 18px "Cinzel",Georgia,serif;letter-spacing:.04em}
.badge{font-size:12px;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);white-space:nowrap}
.badge.demo{background:#fff3d6;color:#7a5a12;border-color:#f0d79a}
.a-x{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:#c9d4ec;padding:11px 12px;border-bottom:3px solid transparent;font-weight:600;font-size:15px}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.a-body{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.a-tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.a-tool .search{flex:1;min-width:200px}
.a-note{background:#fff8e6;border:1px solid #f0dca8;color:#6c5418;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 14px;border-top:1px solid #f0e9d9;align-items:center}
.tr:first-child{border-top:0}
.tr.h{display:none}
.tr .t1{font-weight:600;color:var(--navy)}
.tr .t2{font-size:13px;color:var(--muted)}
.tr .tp{grid-column:1;display:flex;flex-wrap:wrap;gap:4px}
.tr .vd{display:none}
.tr .ac{display:flex;gap:6px;justify-content:flex-end;grid-row:1/3;grid-column:2}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:16px;color:var(--navy)}
.ibtn:hover{background:#f4efe3}
.ibtn.del{color:var(--bad)}
.ibtn:disabled{opacity:.35;cursor:default}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #f0e9d9}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0;font-weight:600;color:var(--navy);overflow-wrap:anywhere}
.lrow .ct{font-size:13px;color:var(--muted);white-space:nowrap}
.addf{display:flex;gap:8px;margin-bottom:12px}
.addf .in{flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h4{margin:0 0 6px;font:700 16px "Lora",Georgia,serif;color:var(--navy)}
.logo-prev{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-prev img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:#1d2232;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad)}
/* ---------- responsivo ---------- */
@media (min-width:640px){
  .hero-in{padding:24px 24px 50px;gap:20px}
  .logo{width:88px;height:88px}
  .ht h1{font-size:30px}
  .adm-btn .lbl{display:inline}
  .bar-in,.layout{padding-left:24px;padding-right:24px}
  .ov{align-items:center;padding:24px}
  .dlg{max-width:600px;border-radius:18px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .dlg.wide{max-width:820px}
  .row2{grid-template-columns:1fr 1fr}
  .tr{grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,2fr) 60px 96px;padding:11px 16px}
  .tr.h{display:grid;background:#faf6ec;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d)}
  .tr .tp{grid-column:auto}
  .tr .vd{display:block;font-size:13px;color:var(--muted)}
  .tr .ac{grid-row:auto;grid-column:auto}
  .tr .t2.oxc{display:block}
  .tr .t2.mob{display:none}
  .a-top-in,.a-body{padding-left:24px;padding-right:24px}
}
@media (max-width:639px){.tr .t2.oxc{display:none}}
@media (min-width:1000px){
  html{scroll-padding-top:120px}
  .hero-in{padding:28px 32px 58px}
  .ht h1{font-size:36px}
  .bar-in{grid-template-columns:minmax(0,1fr) auto;padding:12px 32px 10px}
  .layout{grid-template-columns:270px minmax(0,1fr);padding:18px 32px 70px;gap:28px}
  .side{display:block}
  .chip.oxpick,.oxsep{display:none}
  .letra{font-size:var(--fs)}
}
@media (min-width:1280px){.cards{grid-template-columns:1fr 1fr}}

/* ===== Cores dos Orixás / Entidades ===== */
.sw{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);box-shadow:0 0 0 1px rgba(0,0,0,.22)}
.sw.vazio{background:none;box-shadow:none;border:1.5px dashed #b9ae95;box-sizing:border-box}
.sw.g{width:30px;height:30px;margin:0}
.sopt>span:first-child{display:flex;align-items:center;min-width:0}
.sopt.on .sw{box-shadow:0 0 0 1.5px #fff}
.grp.pint{background:var(--c1);color:var(--tx);border-radius:12px;padding:9px 14px;border:1px solid rgba(0,0,0,.08);border-bottom:6px solid var(--c2);box-shadow:0 2px 8px rgba(30,30,60,.08)}
.grp.pint h2{color:var(--tx)}
.grp.pint .ln{background:linear-gradient(90deg,var(--tx),transparent);opacity:.35}
.grp.pint .ct{color:var(--tx);opacity:.85}
.card.pint{border-top:1px solid var(--line);position:relative;overflow:hidden}
.card.pint::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--c1) 50%,var(--c2) 50%);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.tag.ox{display:inline-flex;align-items:center}
.tag.ox .sw{width:10px;height:10px;margin-right:5px}
.opt .sw{margin-right:9px}
.lrow .nm{display:flex;align-items:center}
.addf.cores{flex-wrap:wrap}
.addf.cores .in{min-width:180px}
.cbtns{display:flex;gap:8px}
.cbtn{display:inline-flex;align-items:center;gap:2px;border:1px solid #d9ccad;background:#fff;border-radius:11px;padding:9px 11px;font-size:14px;color:var(--navy);white-space:nowrap}
.cbtn .sw{width:16px;height:16px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;font-size:12.5px;color:var(--ink)}
.pc.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.outra{display:flex;gap:10px;align-items:center}
.outra input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}

</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <img id="logo" class="logo" alt="Logotipo da casa">
    <div class="ht"><h1 id="nomeCasa"></h1><p id="subtitulo"></p></div>
    <button class="adm-btn" id="btnAdmin" aria-label="Área do administrador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">Administrador</span></button>
  </div>
  <svg class="waves" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34c120-18 240-26 360-14s240 30 360 26 240-28 360-30 240 14 360 22v22H0z" fill="#f7f3ea" opacity=".35"/><path d="M0 42c160-14 320-14 480 0s320 16 480 4 320-22 480-10v24H0z" fill="#f7f3ea"/></svg>
</header>

<div class="bar">
  <div class="bar-in">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar ponto, trecho da letra ou Orixá…" aria-label="Buscar"></div>
    <div class="fsz"><button id="menos" aria-label="Diminuir letra">A−</button><button id="mais" aria-label="Aumentar letra">A+</button></div>
    <nav class="filters" id="filtros" aria-label="Filtros"></nav>
  </div>

function corDe(n){const o=coresLista().find(x=>x.n===n); const c1=o&&HEX.test(o.c1)?o.c1:'', c2=o&&HEX.test(o.c2)?o.c2:''; return {c1:c1||c2,c2:c1?c2:''}}
function coresSem(...nomes){return coresLista().filter(x=>!nomes.includes(x.n)).map(x=>({n:x.n,c1:x.c1||'',c2:x.c2||''}))}
function coresCom(n,c1,c2,velho){const l=coresSem(n,velho); if(c1||c2) l.push({n,c1:c1||c2,c2:c1?(c2||''):''}); return l}
const nomeCor=h=>{const p=PALETA.find(x=>x[1]===String(h).toLowerCase()); return p?p[0]:String(h||'').toUpperCase()};
function lumin(h){const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4); return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function escurece(h,f=.25){return '#'+[1,3,5].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*(1-f)).toString(16).padStart(2,'0')).join('')}
function varsCor(n){const {c1,c2}=corDe(n); if(!c1) return ''; const b=c2||escurece(c1); return '--c1:'+c1+';--c2:'+b+';--tx:'+(lumin(c1)>.45?'#0d2354':'#ffffff')}

function demoStore(){
  const K='pontos_app_demo_v1'; let data=null;
  try{data=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!data||!data.config) data=clone(SEED);
  let cb=()=>{}, acb=()=>{};
  const logado=()=>sessionStorage.getItem('demo_admin')?{email:'Modo demonstração'}:null;
  return {
    mode:'demo',
    subscribe(f){cb=f; f(data.config,data.pontos)},
    onAuth(f){acb=f; f(logado())},
    async login(_e,senha){if(!ADMIN_SENHA){const er=new Error('offline');er.code='offline';throw er} if(String(senha??'')!==ADMIN_SENHA){const er=new Error('Senha incorreta.');er.code='senha';throw er} sessionStorage.setItem('demo_admin','1'); acb(logado())},
    async logout(){sessionStorage.removeItem('demo_admin'); acb(null)},
    async batch(ops){
      const novo=clone(data);
      for(const o of ops){
        if(o.type==='config') novo.config={...novo.config,...o.data};
        else if(o.type==='set'){const i=novo.pontos.findIndex(p=>p.id===o.p.id); if(i>=0) novo.pontos[i]=o.p; else novo.pontos.push(o.p)}
        else if(o.type==='del') novo.pontos=novo.pontos.filter(p=>p.id!==o.id);
      }
      try{localStorage.setItem(K,JSON.stringify(novo))}catch(e){throw new Error('Sem espaço no navegador para salvar.')}
      data=novo; cb(data.config,data.pontos);
    }
  };
}
async function firebaseStore(conf){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp},F,A]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
  const app=initializeApp(conf);
  let db; try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  const auth=A.getAuth(app);
  try{await A.setPersistence(auth,A.browserSessionPersistence)}catch(e){console.warn(e)}
  let c=null,p=[],cb=()=>{},ok1=false,ok2=false;
  const emit=()=>{if(ok1&&ok2) cb(c,p)};
  const erro=e=>{console.error(e); toast('Não foi possível carregar os dados. Verifique a internet.',true)};
  return {
    mode:'firebase',
    subscribe(f){cb=f;
      F.onSnapshot(F.doc(db,'config','app'),s=>{c=s.exists()?s.data():null;ok1=true;emit()},erro);
      F.onSnapshot(F.collection(db,'pontos'),qs=>{p=qs.docs.map(d=>({...d.data(),id:d.id}));ok2=true;emit()},erro);
    },
    onAuth(f){A.onAuthStateChanged(auth,u=>f(u?{email:u.email}:null))},
    login(e,s){return A.signInWithEmailAndPassword(auth,e,s)},
    logout(){return A.signOut(auth)},
    async batch(ops){
      for(let i=0;i<ops.length;i+=400){
        const b=F.writeBatch(db);
        ops.slice(i,i+400).forEach(o=>{
          if(o.type==='config') b.set(F.doc(db,'config','app'),o.data,{merge:true});
          else if(o.type==='set'){const {id,...r}=o.p; b.set(F.doc(db,'pontos',id),r)}
          else b.delete(F.doc(db,'pontos',o.id));
        });
        await b.commit();
      }
    }
  };
}
async function salvar(ops,msg){
  try{await store.batch(ops); if(msg) toast(msg); return true}
  catch(e){console.error(e); toast(/permission/i.test(e.code||e.message)?'Sem permissão: este e-mail não é administrador.':(e.message||'Erro ao salvar.'),true); return false}
}

/* ================= LETRA ================= */
const REP=/^[\[(]?\s*2\s*x\s*[\])]?$/i, TRAD=/^tradu[cç][aã]o\s*:?$/i;
function hl(t,q){
  if(!q) return esc(t);
  const n=norm(t); const i=n.indexOf(q);
  if(i<0||n.length!==t.length) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function linha(t,q){
  if(/^\[\s*refr[aã]o\s*\]$/i.test(t.trim())) return '<span class="l refrao">'+esc(t)+'</span>';
  let h=hl(t,q).replace(/\s*([\[(]\s*2\s*x\s*[\])])\s*$/i,' <span class="x">$1</span>');
  return '<span class="l">'+(h||'&nbsp;')+'</span>';
}
function letraHTML(txt,q=''){
  const blocos=String(txt||'').replace(/\r/g,'').trim().split(/\n\s*\n/);
  const out=[];
  for(const bl of blocos){
    let ls=bl.split('\n').map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim()!=='');
    if(!ls.length) continue;
    if(ls.length===1&&REP.test(ls[0].trim())){ if(out.length) out[out.length-1].rep=true; continue; }
    const e={rep:false,head:'',ls};
    if(ls.length>1&&REP.test(ls[ls.length-1].trim())){ls.pop();e.rep=true}
    if(ls.length>1&&TRAD.test(ls[0].trim())){e.head=ls.shift().replace(/:\s*$/,'')}
    out.push(e);
  }
  return out.map(e=>'<div class="est'+(e.rep?' rep':'')+(e.head?' trad':'')+'">'+(e.head?'<b>'+esc(e.head)+'</b>':'')+e.ls.map(l=>linha(l,q)).join('')+'</div>').join('');
}

const oxIdx=o=>{const i=CFG.orixas.indexOf(o);return i<0?9999:i};
function ordenar(a){return [...a].sort((x,y)=>oxIdx(x.orixa)-oxIdx(y.orixa)||String(x.orixa).localeCompare(String(y.orixa),'pt')||(+x.ordem||0)-(+y.ordem||0)||String(x.titulo).localeCompare(String(y.titulo),'pt'))}
const textoBusca=p=>norm([p.titulo,p.orixa,p.letra].join(' '));
function filtrar({ignoraOrixa=false}={}){
  const q=norm(st.q.trim());
  return PONTOS.filter(p=>(!st.tipo||(p.tipos||[]).includes(st.tipo))&&(ignoraOrixa||!st.orixa||p.orixa===st.orixa)&&(!q||textoBusca(p).includes(q)));
}

function modal(html,{wide=false,onClose}={}){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(ov); document.body.classList.add('noscroll');
  const close=()=>{ov.remove(); if(!$('.ov')&&!adminOpen) document.body.classList.remove('noscroll'); document.removeEventListener('keydown',k); onClose&&onClose()};
  const k=e=>{if(e.key==='Escape'&&ov===$$('.ov').pop()) close()};
  document.addEventListener('keydown',k);
  ov.addEventListener('mousedown',e=>{if(e.target===ov) close()});
  $$('[data-x]',ov).forEach(b=>b.onclick=close);
  return {el:ov,close};
}

function pick({title,options,selected=[],multi=false,todos=null,deco=null}){
  return new Promise(res=>{

    const m=modal('<h3>'+esc(title)+'</h3><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Busca rápida…"></div><div class="plist"></div><div class="dfoot"><button class="btn ghost" data-x>Cancelar</button>'+(multi?'<button class="btn" data-ok>Aplicar</button>':'')+'</div>',{onClose:()=>{if(!done)res(null)}});
    const inp=$('input',m.el), list=$('.plist',m.el);
    const draw=()=>{const q=norm(inp.value);
      let h=(todos!==null&&!multi&&!q)?'<button class="opt'+(!selected.length||!selected[0]?' on':'')+'" data-v="">'+esc(todos)+'</button>':'';
      const f=options.filter(o=>norm(o).includes(q));

      list.innerHTML=h||'<p class="muted">Nada encontrado.</p>'};
    draw(); inp.oninput=draw; if(desktop()) inp.focus();
    list.onclick=e=>{const b=e.target.closest('.opt'); if(!b) return; const v=b.dataset.v;
      if(multi){sel.has(v)?sel.delete(v):sel.add(v); b.classList.toggle('on')} else {done=true; m.close(); res([v])}};

function reduzirImagem(file,max){
  return new Promise((res,rej)=>{const r=new FileReader(); r.onerror=rej; r.onload=()=>{const im=new Image(); im.onerror=rej; im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); let u=c.toDataURL('image/webp',.9); if(!u.startsWith('data:image/webp')) u=c.toDataURL('image/png'); res(u)}; im.src=r.result}; r.readAsDataURL(file)});
}

async function listaRenomear(k,i){

    if(k==='orixas'&&p.orixa===velho) ops.push({type:'set',p:{...p,orixa:novo}});
    if(k==='tipos'&&(p.tipos||[]).includes(velho)) ops.push({type:'set',p:{...p,tipos:p.tipos.map(t=>t===velho?novo:t)}});
  });
  if(st.orixa===velho) st.orixa=novo; if(st.tipo===velho) st.tipo=novo;
  await salvar(ops,'Renomeado'+(ops.length>1?' (e atualizado em '+plural(ops.length-1,'ponto','pontos')+')':'')+'.');
}
async function listaRemover(k,i){
  const n=CFG[k][i]; const usados=PONTOS.filter(p=>k==='orixas'?p.orixa===n:(p.tipos||[]).includes(n));
  if(usados.length){avisar('Não é possível remover','<b>'+esc(n)+'</b> está em '+plural(usados.length,'ponto','pontos')+'. Altere ou exclua esses pontos antes de remover o item. Isso evita pontos sem classificação.');return}
  if(!await confirmar('Remover item?','Remover <b>'+esc(n)+'</b> da lista?',{ok:'Remover',perigo:true})) return;
  const data={[k]:CFG[k].filter((_,j)=>j!==i)}; if(k==='orixas') data.cores=coresSem(n);
  await salvar([{type:'config',data}],'Item removido.');
}
async function listaMover(k,i,d){const l=[...CFG[k]]; const j=i+d; if(j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; await salvar([{type:'config',data:{[k]:l}}])}

let novaCor={c1:'',c2:''};
const corBtn=(id,rot,v)=>'<button type="button" class="cbtn" data-cf="'+id+'">'+swHex(v,'')+'<span>'+(v?esc(nomeCor(v)):rot)+'</span></button>';
function escolherCor(titulo,atual,nenhuma){
  return new Promise(res=>{
    let done=false; const fim=v=>{done=true; m.close(); res(v)};
    const m=modal('<h3>'+esc(titulo)+'</h3><div class="pal">'+PALETA.map(([n,h])=>'<button type="button" class="pc'+(h===String(atual).toLowerCase()?' on':'')+'" data-h="'+h+'"><i class="sw g" style="--c1:'+h+';--c2:'+h+'"></i><span>'+n+'</span></button>').join('')+
      (nenhuma?'<button type="button" class="pc'+(!atual?' on':'')+'" data-h=""><i class="sw g vazio"></i><span>Nenhuma</span></button>':'')+
      '</div><div class="fld" style="margin-top:12px"><label>Outra cor</label><div class="outra"><input type="color" value="'+(HEX.test(atual)?atual:'#c49a48')+'"><button type="button" class="btn ghost sm" data-ok>Usar esta cor</button></div></div><div class="dfoot"><button type="button" class="btn ghost" data-x>Cancelar</button></div>',{onClose:()=>{if(!done)res(null)}});
    $('.pal',m.el).onclick=e=>{const b=e.target.closest('.pc'); if(b) fim(b.dataset.h)};
    $('[data-ok]',m.el).onclick=()=>fim($('input[type=color]',m.el).value.toLowerCase());
  });
}
function editarCores(i){
  const n=CFG.orixas[i]; if(n===undefined) return; const c={...corDe(n)};
  const m=modal('<h3>Cores de '+esc(n)+'</h3><div class="row2"><div class="fld"><label>Cor 1 (principal)</label><span id="b1"></span></div><div class="fld"><label>Cor 2</label><span id="b2"></span></div></div><div class="fld"><label>Prévia</label><div id="prev"></div></div><div class="dfoot"><button type="button" class="btn ghost" data-x>Cancelar</button><button type="button" class="btn ghost" data-limpa>Sem cor</button><button type="button" class="btn gold" data-salva>Salvar cores</button></div>');
  const draw=()=>{$('#b1',m.el).innerHTML=corBtn('e1','Escolher…',c.c1); $('#b2',m.el).innerHTML=corBtn('e2','Nenhuma',c.c2);
    const b=c.c1?(c.c2||escurece(c.c1)):''; $('#prev',m.el).innerHTML=c.c1?'<div class="grp pint" style="--c1:'+c.c1+';--c2:'+b+';--tx:'+(lumin(c.c1)>.45?'#0d2354':'#ffffff')+';margin:0"><h2>'+esc(n)+'</h2><span class="ln"></span><span class="ct">'+plural(PONTOS.filter(p=>p.orixa===n).length,'ponto','pontos')+'</span></div>':'<p class="muted">Sem cor: o grupo fica no visual padrão.</p>'};
  draw();
  m.el.addEventListener('click',async e=>{const b=e.target.closest('[data-cf]'); if(!b) return; const um=b.dataset.cf==='e1';
    const v=await escolherCor(um?'Cor 1 (principal)':'Cor 2',um?c.c1:c.c2,!um); if(v===null) return; if(um) c.c1=v; else c.c2=v; draw()});
  $('[data-limpa]',m.el).onclick=()=>{c.c1='';c.c2='';draw()};
  $('[data-salva]',m.el).onclick=async()=>{if(!c.c1&&c.c2){toast('Escolha a Cor 1 primeiro.',true);return} if(await salvar([{type:'config',data:{cores:coresCom(n,c.c1,c.c2)}}],'Cores salvas.')) m.close()};
}
function editarPonto(id){
  const orig=id?PONTOS.find(p=>p.id===id):null;
  const p=orig?clone(orig):{id:novoId(),titulo:'',orixa:st.orixa||'',tipos:st.tipo?[st.tipo]:[],letra:'',videoUrl:'',ordem:''};
  p.tipos=p.tipos||[];
  const m=modal('<h3>'+(orig?'Editar ponto':'Novo ponto')+'</h3><form id="fP" novalidate>'+
    '<div class="fld"><label>Título do ponto *</label><input class="in" name="titulo" maxlength="120" placeholder="Ex.: 1º Ponto, Ponto de Subida"></div>'+
    '<div class="row2"><div class="fld"><label>Orixá / Entidade *</label><button type="button" class="selbtn" id="bOx"></button></div>'+
    '<div class="fld"><label>Ordem no grupo</label><input class="in" name="ordem" type="number" inputmode="numeric" placeholder="Automática"><div class="hint">Menor número aparece primeiro.</div></div></div>'+
    '<div class="fld"><label>Tipos de trabalho</label><button type="button" class="selbtn" id="bTp"></button></div>'+
    '<div class="fld"><label>Link do vídeo (YouTube)</label><div style="display:flex;gap:8px"><input class="in" name="video" inputmode="url" placeholder="https://www.youtube.com/watch?v=…"><button type="button" class="btn ghost" id="bTest">Testar</button></div><div id="vMsg" class="hint">O mesmo link serve para tocar no app e para abrir no YouTube.</div><div id="vPrev"></div></div>'+
    '<div class="fld"><label>Letra do ponto</label><textarea class="in" name="letra" placeholder="Digite ou cole a letra…"></textarea><div class="hint">Deixe <b>uma linha em branco</b> entre as estrofes. Para repetir a estrofe inteira, escreva <b>2X</b> sozinho na última linha dela. Para uma linha só, escreva (2X) no fim da linha.</div><button type="button" class="link-btn" id="bPrev" style="padding-left:0">Pré-visualizar letra</button><div id="lPrev"></div></div>'+
    '<div class="err hidden" id="pErr"></div><div class="dfoot"><button type="button" class="btn ghost" data-x>Cancelar</button><button class="btn gold">Salvar ponto</button></div></form>',{wide:true});
  const f=$('#fP',m.el); f.titulo.value=p.titulo; f.ordem.value=p.ordem===''?'':(+p.ordem||''); f.video.value=p.videoUrl||''; f.letra.value=p.letra||'';
  const drawOx=()=>$('#bOx',m.el).innerHTML=p.orixa?'<span>'+esc(p.orixa)+'</span><span>▾</span>':'<span class="ph">Selecionar…</span><span>▾</span>';
  const drawTp=()=>$('#bTp',m.el).innerHTML=p.tipos.length?'<span class="selchips">'+p.tipos.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</span><span>▾</span>':'<span class="ph">Selecionar um ou mais…</span><span>▾</span>';
  drawOx(); drawTp();
  $('#bOx',m.el).onclick=async()=>{if(!CFG.orixas.length){toast('Cadastre Orixás/Entidades na aba própria.',true);return} const r=await pick({title:'Orixá / Entidade',options:CFG.orixas,selected:[p.orixa],deco:sw}); if(r){p.orixa=r[0]; drawOx()}};
  $('#bTp',m.el).onclick=async()=>{if(!CFG.tipos.length){toast('Cadastre Tipos de Trabalho na aba própria.',true);return} const r=await pick({title:'Tipos de trabalho',options:CFG.tipos,selected:p.tipos,multi:true}); if(r){p.tipos=r; drawTp()}};
  $('#bTest',m.el).onclick=()=>{const u=f.video.value.trim(), id=ytId(u), msg=$('#vMsg',m.el);
    if(!u){msg.className='hint';msg.textContent='Sem link: o ponto ficará sem vídeo.';$('#vPrev',m.el).innerHTML='';return}
    if(!id){msg.className='err';msg.textContent='Link do YouTube não reconhecido.';$('#vPrev',m.el).innerHTML='';return}
    msg.className='okmsg'; msg.textContent='Link válido. Se o vídeo não tocar aqui, o dono pode ter bloqueado a reprodução fora do YouTube; o botão "Abrir no YouTube" continuará funcionando.';
    $('#vPrev',m.el).innerHTML='<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>'};
  $('#bPrev',m.el).onclick=()=>{const d=$('#lPrev',m.el); d.innerHTML=d.innerHTML?'':'<div class="prev letra">'+(letraHTML(f.letra.value)||'<span class="muted">Letra vazia.</span>')+'</div>'};
  f.onsubmit=async e=>{e.preventDefault(); const er=$('#pErr',m.el); const erros=[];
    const titulo=f.titulo.value.trim(), url=f.video.value.trim();
    if(!titulo) erros.push('Informe o título.');
    if(!p.orixa) erros.push('Selecione o Orixá/Entidade.');
    if(url&&!ytId(url)) erros.push('O link do vídeo não é do YouTube ou está incompleto.');
    if(erros.length){er.innerHTML=erros.join('<br>'); er.classList.remove('hidden'); return}
    let ordem=f.ordem.value===''?null:+f.ordem.value;
    if(ordem===null) ordem=(orig&&orig.orixa===p.orixa&&+orig.ordem)?+orig.ordem:Math.max(0,...PONTOS.filter(x=>x.orixa===p.orixa&&x.id!==p.id).map(x=>+x.ordem||0))+10;
    const novo={id:p.id,titulo,orixa:p.orixa,tipos:CFG.tipos.filter(t=>p.tipos.includes(t)),letra:f.letra.value.replace(/\r/g,'').trim(),videoUrl:url,ordem};
    const b=$('button.gold',f); b.disabled=true;
    if(await salvar([{type:'set',p:novo}],orig?'Ponto atualizado.':'Ponto adicionado.')) m.close(); else b.disabled=false;
  };
  if(desktop()) f.titulo.focus();
}

/* ================= EVENTOS ================= */
function lerURL(){const u=new URLSearchParams(location.search); st.tipo=u.get('tipo')||''; st.orixa=u.get('orixa')||''}
function gravarURL(){const u=new URLSearchParams(); if(st.tipo)u.set('tipo',st.tipo); if(st.orixa)u.set('orixa',st.orixa); history.replaceState(null,'',location.pathname+(u.toString()?'?'+u:''))}
function aplicar(){gravarURL(); renderFiltros(); renderLista()}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.video!==undefined&&t.closest('.card')){tocarVideo(t);return}
  if(t.dataset.tipo!==undefined&&t.closest('#filtros')){st.tipo=t.dataset.tipo; aplicar(); return}
  if(t.dataset.ox!==undefined&&t.closest('#sideList')){st.orixa=t.dataset.ox; aplicar(); const y=$('.layout').offsetTop-8; if(scrollY>y) scrollTo({top:y,behavior:'smooth'}); return}
  const act=t.dataset.act;
  if(act==='pickTipo'){const r=await pick({title:'Tipo de trabalho',options:CFG.tipos,selected:[st.tipo],todos:'Todos'}); if(r){st.tipo=r[0]; aplicar()} return}
  if(act==='pickOx'){const r=await pick({title:'Orixá / Entidade',options:CFG.orixas,selected:[st.orixa],todos:'Todos',deco:sw}); if(r){st.orixa=r[0]; aplicar()} return}
  if(act==='limpar'){st.q='';st.tipo='';st.orixa='';$('#q').value=''; aplicar(); return}
  if(act==='share'){const url=location.href; try{await navigator.clipboard.writeText(url); toast('Link copiado. Envie para os médiuns ou gere um QR code.')}catch(x){perguntar('Copie o link',url)} return}
  if(t.id==='btnAdmin'){USER?abrirAdmin():abrirLogin(); return}
  if(t.id==='mais'||t.id==='menos'){fs=Math.max(14,Math.min(30,fs+(t.id==='mais'?2:-2))); aplicaFs(); return}
  if(t.id==='topo'){scrollTo({top:0,behavior:'smooth'}); return}
  if(!t.closest('#admin')) return;
  // admin
  if(t.dataset.tab){aTab=t.dataset.tab; renderAdmin(); return}
  const a=t.dataset.a;
  if(a==='fechar'){fecharAdmin(); return}
  if(a==='sair'){await store.logout(); fecharAdmin(); toast('Você saiu da área do administrador.'); return}
  if(a==='novo'){editarPonto(null); return}
  if(a==='exportar'){exportar(); return}
  if(a==='seed'){try{await substituirTudo(clone(SEED),'Pontos iniciais carregados.')}catch(x){} return}
  if(t.dataset.ed){editarPonto(t.dataset.ed); return}
  if(t.dataset.dp){const p=PONTOS.find(x=>x.id===t.dataset.dp); if(p&&await confirmar('Excluir ponto?','Excluir <b>'+esc(p.titulo)+'</b> ('+esc(p.orixa)+')? Esta ação não pode ser desfeita.',{ok:'Excluir',perigo:true})) await salvar([{type:'del',id:p.id}],'Ponto excluído.'); return}
  if(t.dataset.mv!==undefined){await listaMover(aTab,+t.dataset.mv,+t.dataset.d); return}
  if(t.dataset.cores!==undefined){editarCores(+t.dataset.cores); return}
  if(t.dataset.cf==='nc1'||t.dataset.cf==='nc2'){const um=t.dataset.cf==='nc1'; const v=await escolherCor(um?'Cor 1 (principal)':'Cor 2',um?novaCor.c1:novaCor.c2,!um); if(v===null) return; if(um) novaCor.c1=v; else novaCor.c2=v; t.outerHTML=corBtn(t.dataset.cf,um?'Cor 1':'Cor 2',v); return}
  if(t.dataset.rn!==undefined){await listaRenomear(aTab,+t.dataset.rn); return}
  if(t.dataset.rm!==undefined){await listaRemover(aTab,+t.dataset.rm); return}
});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-add]'); if(!f) return; e.preventDefault(); const i=$('input',f); if(f.dataset.add==='orixas'&&!novaCor.c1&&novaCor.c2){toast('Escolha a Cor 1 primeiro.',true);return} if(await listaAdd(f.dataset.add,i.value)) i.value=''});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){st.q=t.value; renderFiltros(); renderLista(); return}
  if(t.id==='oxq'){st.oxq=t.value; renderFiltros(); return}
  if(t.dataset.aq){aq[t.dataset.aq]=t.value; refreshAdmin()}
});
let fs=+(localStorage.getItem('fs')||18);
function aplicaFs(){document.documentElement.style.setProperty('--fs',fs+'px'); localStorage.setItem('fs',fs)}
aplicaFs();
addEventListener('scroll',()=>{$('#topo').classList.toggle('hidden',scrollY<700)},{passive:true});

/* ================= INÍCIO ================= */
(async()=>{
  lerURL(); renderHeader(); renderLista();
  try{store=FIREBASE_CONFIG?await firebaseStore(FIREBASE_CONFIG):demoStore()}
  catch(e){console.error(e); toast('Falha ao conectar ao Firebase. Usando modo demonstração.',true); store=demoStore()}
  store.onAuth(u=>{USER=u; if(!u&&adminOpen) fecharAdmin(); else if(adminOpen) renderAdmin(); renderLista()});
  store.subscribe((c,p)=>{CFG={...DEF_CFG,...(c||{})}; CFG.orixas=CFG.orixas||[]; CFG.tipos=CFG.tipos||[]; PONTOS=p||[]; carregado=true; renderAll()});
})();

</script>
